body{background:transparent}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
.scr{display:none;flex-direction:column;gap:14px}.scr.on{display:flex}

h1{margin:12px 0 0;text-align:center;font-size:36px;letter-spacing:2px;color:#fff;font-weight:900;text-shadow:0 3px 0 #1c2a4a,3px 0 0 #1c2a4a,-3px 0 0 #1c2a4a,0 -3px 0 #1c2a4a,3px 3px 0 #1c2a4a,-3px 3px 0 #1c2a4a,3px -3px 0 #1c2a4a,-3px -3px 0 #1c2a4a;animation:bob 2s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-5px)}}
.sub{text-align:center;color:#fff;margin:0;font-weight:800;text-shadow:0 2px 0 #1c2a4a}

.card{background:#ffffff;border:4px solid #1c2a4a;border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(28,42,74,.35)}
.card h3{margin:0 0 12px;font-size:16px;color:#1c2a4a;font-weight:800}

.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:12px 6px;border-radius:16px;border:3px solid #1c2a4a;background:#fff;color:#1c2a4a;font:inherit;font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(28,42,74,.4);cursor:pointer}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(28,42,74,.4)}
#g-row .chip{flex:1 1 44%;font-size:17px;padding:12px 6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#g-row .chip[data-m="read"]{background:#e60012}
#g-row .chip[data-m="write"]{background:#1f6fe5}
#g-row .chip small{font-weight:700;font-size:12px;display:block;margin-top:2px;opacity:.95}
#a-row .chip.sel{background:#ffd400;color:#5a3600;border-color:#1c2a4a}

.big{padding:18px;border:4px solid #1c2a4a;border-radius:18px;background:linear-gradient(#ffe45c,#ffb800);color:#5a3600;font:inherit;font-size:22px;font-weight:800;box-shadow:0 6px 0 rgba(28,42,74,.45);text-shadow:0 1px 0 rgba(255,255,255,.6);cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(28,42,74,.45)}

.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;background:#1c2a4a;color:#fff;border:3px solid #fff;border-radius:18px;padding:8px 12px;gap:6px}
.hearts{font-size:20px;letter-spacing:2px}
#sc::before{content:"🪙 "}

.bar{height:16px;border:3px solid #fff;background:#1c2a4a;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#3ecf4a;transition:width .1s linear,background .3s}

/* 問題表示エリア：高コントラスト設計 */
.q{text-align:center;padding:22px 12px;background:#ffffff !important;border:4px solid #1c2a4a !important;box-shadow:0 8px 0 rgba(0,0,0,.25) !important}
.tag{display:inline-block;background:#ffd400;color:#5a3600;border:2px solid #b37400;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:800}
.word{font-size:52px;font-weight:900;margin:12px 0;line-height:1.2;word-break:keep-all;color:#111827;text-shadow:1px 1px 0 #fff}
.hint{color:#4b5563;font-size:16px;font-weight:700}

.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch button{padding:16px 6px;border-radius:18px;border:3px solid #1c2a4a;background:#ffffff;color:#111827;font:inherit;font-size:24px;font-weight:800;min-height:64px;box-shadow:0 5px 0 rgba(28,42,74,.4);cursor:pointer}
.ch button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(28,42,74,.4)}
.ch button.ok{background:#3ecf4a !important;border-color:#157a1f !important;color:#fff !important;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ch button.ng{background:#ff4b4b !important;border-color:#8a000a !important;color:#fff !important;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ch button:disabled{opacity:1}

.fb{background:#fff;border:3px solid #1c2a4a;border-radius:16px;padding:10px;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.fb:empty{visibility:hidden}
.fb.ok{color:#14862a}.fb.ng{color:#d0021b}

.stars{font-size:46px;text-align:center;filter:drop-shadow(0 3px 0 #1c2a4a)}
.score{font-size:48px;font-weight:800;text-align:center;color:#ffd400;text-shadow:0 3px 0 #1c2a4a,3px 0 0 #1c2a4a,-3px 0 0 #1c2a4a,0 -3px 0 #1c2a4a}
.miss{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px dashed #b9c4d8;color:#1c2a4a;font-size:18px;font-weight:700}
.miss span:last-child{color:#4b5563}

.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.08)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== 各「国」テーマ別スタイル ===== */
/* 🎩 帽子の国 (Cap Kingdom): 月夜と霧のパープル */
body[data-world="4read"] {
  background: radial-gradient(circle at 80% 20%, #fff9d6 0%, #d8c3ff 15%, transparent 16%),
              radial-gradient(ellipse at 50% 80%, rgba(255,255,255,0.15), transparent 70%),

}
body[data-world="4read"] .top { background: #2a1b4e; border-color: #9d59ff; }
body[data-world="4read"] .tag { background: #c496ff; color: #20004d; border-color: #8c42f5; }

/* 🦖 滝の国 (Cascade Kingdom): 大自然の岩山と深緑 */
body[data-world="4write"] {
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.3), transparent 60%),
              linear-gradient(180deg, #1b5e20 0%, #2e7d32 30%, #0288d1 75%, #01579b 100%) fixed !important;
}
body[data-world="4write"] .top { background: #0f3813; border-color: #81c784; }
body[data-world="4write"] .tag { background: #a5d6a7; color: #003300; border-color: #388e3c; }

/* 🌲 森の国 (Wooded Kingdom): 機械と神秘の森林 */
body[data-world="5read"] {
  background: radial-gradient(circle at 20% 30%, rgba(129,199,132,0.3) 0%, transparent 40%),
              linear-gradient(180deg, #0d301e 0%, #1b4d3e 50%, #2c3e35 100%) fixed !important;
}
body[data-world="5read"] .top { background: #0b2115; border-color: #4db6ac; }
body[data-world="5read"] .tag { background: #80cbc4; color: #00251a; border-color: #00897b; }

/* 🏜️ 砂の国 (Sand Kingdom): 黄金の砂漠と夕焼けの遺跡 */
body[data-world="5write"] {
  background: radial-gradient(circle at 50% 20%, #ffe082 0%, #ff8f00 25%, transparent 26%),

}
body[data-world="5write"] .top { background: #3e1604; border-color: #ffb74d; }
body[data-world="5write"] .tag { background: #ffe082; color: #4e2600; border-color: #ff8f00; }

/* 🏙️ 都市の国 (Metro Kingdom): 煌めく夜景の巨大都市 */
body[data-world="6read"] {
  background: linear-gradient(180deg, #090a0f 0%, #121829 40%, #1a233a 100%) fixed !important;
}
body[data-world="6read"] .top { background: #101424; border-color: #00e5ff; }
body[data-world="6read"] .tag { background: #00e5ff; color: #002b36; border-color: #00b8d4; }

/* 🌊 海の国 (Seaside Kingdom): 常夏のコバルトブルービーチ */
body[data-world="6write"] {
  background: radial-gradient(ellipse at 50% 10%, rgba(255,255,255,0.6), transparent 50%),

}
body[data-world="6write"] .top { background: #00363a; border-color: #80d8ff; }
body[data-world="6write"] .tag { background: #80d8ff; color: #002733; border-color: #0091ea; }

const P=[];for(const g in D)D[g].split(";").forEach(s=>{const[w,r]=s.split(",");P.push({g:+g,w,r})});
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let G="4",M="read",Q=[],i=0,score=0,lives=3,combo=0,miss=[],t=10,tm=null,lock=false;

function bestGet(g,m){try{return JSON.parse(localStorage.getItem("kj-bests")||"{}")[g+m]||0}catch(e){return 0}}
function bestSet(v){try{const o=JSON.parse(localStorage.getItem("kj-bests")||"{}");o[G+M]=v;localStorage.setItem("kj-bests",JSON.stringify(o))}catch(e){}}
function show(id){document.querySelectorAll(".scr").forEach(e=>e.classList.toggle("on",e.id===id))}

function home(){
  bgmStop();
  document.body.removeAttribute("data-world");
  show("s-start");
  document.querySelectorAll("#g-row .chip").forEach(c=>{
    const b=bestGet(c.dataset.g,c.dataset.m);
    const key=c.dataset.g+c.dataset.m;
    const icons={"4read":"🎩 ","4write":"🦖 ","5read":"🌲 ","5write":"🏜️ ","6read":"🏙️ ","6write":"🌊 ","7read":"❄️ ","7write":"🌋 ","8read":"🌕 ","8write":"🍄 "};
    const gradeLabel = {4:"7級",5:"6級",6:"5級",7:"4級",8:"3級"}[c.dataset.g];
    c.innerHTML=icons[key]+WORLD_NAMES[key]+"<br><small>"+gradeLabel+" "+(c.dataset.m==="read"?"よみ":"かき")+" | "+(b?"🏆 "+b+"点":"記録なし")+"</small>"
  });
  $("best").textContent=""
}

$("g-row").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;G=b.dataset.g;M=b.dataset.m;$("g-row").querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel",c===b));start()};
$("again").onclick=start;$("home").onclick=home;

function start(){
  audioInit();sfx("click");bgmStart();
  document.body.setAttribute("data-world", G + M);
  const pool=P.filter(p=>G==="all"||p.g==+G);
  Q=sh(pool).slice(0,10).map((p,k)=>({...p,m:M==="mix"?(k%2?"write":"read"):M}));
  Q=sh(Q);i=0;score=0;lives=3;combo=0;miss=[];show("s-play");ask()
}

function hearts(){$("hp").textContent="❤️".repeat(lives)+"🤍".repeat(3-lives)}

function ask(){
  lock=false;const q=Q[i];hearts();$("no").textContent=(i+1)+"/"+Q.length;$("sc").textContent=score+"点";
  $("fb").textContent="";$("fb").className="fb";$("nx").style.display="none";
  const wName = WORLD_NAMES[q.g + q.m] || "";
  const gradeNum = {4:7,5:6,6:5,7:4,8:3}[q.g];
  $("tg").textContent=wName + " (漢検"+gradeNum+"級・"+(q.m==="read"?"よみ":"かき")+")";
  $("wd").textContent=q.m==="read"?q.w:q.r;$("hn").textContent=q.m==="read"?"なんと読む？":"どの漢字？";
  const key=q.m==="read"?"r":"w";
  const ds=sh(P.filter(p=>p[key]!==q[key])).sort((a,b)=>Math.abs(a[key].length-q[key].length)-Math.abs(b[key].length-q[key].length)).slice(0,3);
  const opts=sh([q,...ds]);const box=$("ch");box.innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.textContent=o[key];b.onclick=()=>answer(b,o===q,box);box.appendChild(b)});
  t=10;tick();clearInterval(tm);tm=setInterval(()=>{t-=.1;tick();if(t<=0){clearInterval(tm);answer(null,false,box)}},100)
}

function tick(){
  if(t>9.9)lastS=11;
  const s=Math.ceil(t);
  if(t<=3&&t>0&&s!==lastS){lastS=s;sfx("tick")}
  const b=$("tb");b.style.width=Math.max(t,0)*10+"%";
  b.style.background=t>5?"#3ecf4a":t>2.5?"#ffb800":"#ff4b4b"
}

function answer(btn,ok,box){
  if(lock)return;lock=true;clearInterval(tm);const q=Q[i],key=q.m==="read"?"r":"w";
  box.querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.textContent===q[key])b.classList.add("ok")});
  const fb=$("fb");
  if(ok){
    combo++;const pt=100+Math.round(t*5)+Math.min(combo-1,5)*20;score+=pt;
    fb.className="fb ok pop";fb.textContent="⭕ せいかい！ +"+pt+(combo>1?"（"+combo+"れんぞく🔥）":"");
    sfx("ok");vib(20);
  }else{
    combo=0;lives--;miss.push(q);if(btn)btn.classList.add("ng");
    $("qc").classList.add("shake");setTimeout(()=>$("qc").classList.remove("shake"),400);
    fb.className="fb ng";fb.textContent=(btn?"❌ ざんねん！":"⏰ じかんぎれ！")+" 答え："+q.w+"（"+q.r+"）";
    sfx(btn?"ng":"time");vib([40,40,40]);
  }
  $("sc").textContent=score+"点";hearts();
  const n=$("nx");n.style.display="block";n.onclick=nextQ;
  if(ok)setTimeout(()=>{if(lock&&Q[i]===q&&n.style.display==="block")nextQ()},900)
}

function nextQ(){if(!lock)return;lock=false;$("nx").style.display="none";i++;if(lives<=0||i>=Q.length)finish();else ask()}

function finish(){
  clearInterval(tm);show("s-end");const cleared=lives>0,ok=Q.length-miss.length;
  const stars=!cleared?0:miss.length===0?3:miss.length<=2?2:1;
  $("st").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  bgmStop();sfx(cleared?"win":"lose");vib(cleared?[30,30,30,30,80]:[120]);
  $("rs").textContent=score+"点";
  const b=bestGet(G,M);let msg=cleared?"クリア！ "+Q.length+"問中"+ok+"問せいかい":"ハートがなくなっちゃった…";
  if(score>b){bestSet(score);msg+="\n🎉 このコースのベスト更新！"}else msg+="\nこのコースのベスト："+b+"点";
  $("rm").style.whiteSpace="pre-line";$("rm").textContent=msg;
  const l=$("ml");l.innerHTML="";$("ms").style.display=miss.length?"block":"none";
  miss.forEach(m=>{
    const d=document.createElement("div");d.className="miss";
    d.innerHTML="<span></span><span></span>";
    d.children[0].textContent=m.w;d.children[1].textContent=m.r;
    l.appendChild(d)
  })
}

/* ===== おと・サウンドマネージャー ===== */
const S={bgm:true,se:true,vb:true};
let AC=null,mg=null,bgmT=null,bgmOn=false,stp=0,lastS=11,currentWorld="4read";

function audioInit(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      mg=AC.createGain();mg.gain.value=0.8;mg.connect(AC.destination);
    }
    if(AC.state==="suspended")AC.resume();
  }catch(e){}
}

function tone(f,d,type,vol,when){
  if(!AC)return;
  try{
    const t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||.2,t0+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.05);
  }catch(e){}
}

/* ノイズ生成（ドラム・ウェーブ音用） */
function noise(d,vol,when){
  if(!AC)return;
  try{
    const t0=AC.currentTime+(when||0), bs=AC.sampleRate*d, b=AC.createBuffer(1,bs,AC.sampleRate), data=b.getChannelData(0);
    for(let i=0;i<bs;i++) data[i]=Math.random()*2-1;
    const src=AC.createBufferSource(), g=AC.createGain();
    src.buffer=b;
    g.gain.setValueAtTime(vol||0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
    src.connect(g);g.connect(mg);src.start(t0);src.stop(t0+d+.02);
  }catch(e){}
}

const N=n=>440*Math.pow(2,(n-9)/12);

/* HD振動風マイクロパルス */
function vib(p){
  if(!S.vb)return;
  try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}
}

/* マリオオデッセイ風 効果音 */
function sfx(k){
  if(!S.se||!AC)return;
  audioInit();
  
  if(k==="click"){
    // ボタン押下（キャッピー投げ風スウィッシュ音）
    tone(600,.04,"sine",.12);
    tone(1200,.06,"triangle",.08,.02);
    vib([10, 15, 10]);
  }
  else if(k==="ok"){
    // コイン・パワームーン獲得風サウンド
    const b=Math.min(combo,5)*2;
    tone(N(19+b),.12,"sine",.22);
    tone(N(26+b),.35,"sine",.28,.06);
    vib([15, 30, 25, 40]);
  }
  else if(k==="ng"){
    // 敵ヒット・ミス音（ズッコケ低音）
    tone(N(-3),.12,"sawtooth",.22);
    tone(N(-8),.25,"sawtooth",.22,.1);
    vib([40, 50, 60]);
  }
  else if(k==="time"){
    // タイムオーバー音
    tone(N(8),.1,"square",.15);
    tone(N(3),.15,"square",.15,.08);
    tone(N(-2),.25,"square",.18,.18);
    vib([30, 30, 30, 50]);
  }
  else if(k==="tick"){
    // カウントダウン（ウッドブロック風）
    tone(N(21),.04,"triangle",.12);
    vib(8);
  }
  else if(k==="win"){
    // パワームーンゲット・ファンファーレ（オデッセイ風）
    const m=[12, 16, 19, 24, 21, 24, 28];
    const d=[0.12, 0.12, 0.12, 0.2, 0.12, 0.12, 0.6];
    let tOffset=0;
    m.forEach((note, idx)=>{
      tone(N(note), d[idx]*1.1, "triangle", 0.28, tOffset);
      tone(N(note-12), d[idx]*1.1, "sawtooth", 0.12, tOffset);
      tOffset += d[idx];
    });
    vib([20, 20, 20, 20, 40, 40, 100]);
  }
  else if(k==="lose"){
    // ゲームオーバー（悲しい下降旋律）
    [15, 14, 13, 12, 7, 0].forEach((n,j)=>{
      tone(N(n), .22, "sawtooth", .18, j*.14);
    });
    vib([80, 40, 80, 40, 120]);
  }
}

function bgmStart(){
  if(!S.bgm||bgmOn||!AC)return;
  bgmOn=true;stp=0;
  const key = G + M;
  const track = BGM_DATA[key] || BGM_DATA["4read"];
  
  bgmT=setInterval(()=>{
    const m = track.mel[stp % track.mel.length];
    if(m !== null && m !== undefined) {
      tone(N(m), 0.18, track.type, 0.05);
    }
    if(stp % 2 === 0) {
      const bIdx = Math.floor((stp / 2) % track.bas.length);
      const b = track.bas[bIdx];
      if(b !== null && b !== undefined) {
        tone(N(b - 12), 0.35, track.bType, 0.08);
      }
    }
    // トロピカル/砂漠/都市コースの波音・ノイズパーカッション
    if((key==="6write" || key==="5write" || key==="6read") && stp % 4 === 2) {
      noise(0.06, 0.02);
    }
    stp++;
  }, track.tempo);
}

function bgmStop(){
  clearInterval(bgmT);
  bgmOn=false;
}

function setA(k,v){
  S[k]=v;
  document.querySelectorAll('[data-a="'+k+'"]').forEach(c=>c.classList.toggle("sel",v));
  if(k==="bgm"){
    $("mq").textContent=v?"🎵":"🔇";
    if(!v) bgmStop();
    else if($("s-play").classList.contains("on")){
      audioInit();
      bgmStart();
    }
  }
  if(k==="vb"&&v) vib(30);
  if(k==="se"&&v){
    audioInit();
    sfx("click");
  }
  try{localStorage.setItem("kj-a",JSON.stringify(S))}catch(e){}
}

document.querySelectorAll("[data-a]").forEach(c=>c.onclick=()=>setA(c.dataset.a,!S[c.dataset.a]));
